[project]
name = "cbuild"
version = "1.0.0"
description = "GNU-make inspired build system that can build projects efficiently"
license = "MIT"
authors = [{ name = "Yagiz Erdem" }]
requires-python = ">=3.15"
dependencies = [
    # Must match the ANTLR version that generated cbuild_parser.
    "antlr4-python3-runtime==4.13.2",
    # Lua runtime for buildfile hooks (cbuild_backend/interpreter).
    "lupa>=2.0",
]

[project.scripts]
cbuild = "main:_main"

[dependency-groups]
dev = [
    "antlr4-tools",
    "ruff",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = [
    "cbuild_backend*",
    "cbuild_compiler*",
    "cbuild_parser*",
    "cli*",
    "core*",
    "gnu_make_functions*",
    "preprocessor*",
    "type*",
    "util*",
]

[tool.ruff]
target-version = "py315"
line-length = 88
extend-exclude = [
    # Generated by ANTLR; never edit by hand.
    "cbuild_parser",
    "antlr-doc",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
